 <div><label style="margin-top:0">학습된 취향</label>${Object.keys(pref.st).length?`<div class="chips">${Object.entries(pref.st).map(([k,v])=>`<span class="chip on">${k} ${v}회</span>`).join('')}</div>`:'<p class="sub">아직 기록이 없습니다.</p>'}
 <label style="margin-top:24px">기록</label>${logs.length?logs.map(l=>`<div style="margin-bottom:14px">${trio(l.ids.map(byId).filter(Boolean))}<p class="sub">${l.d} / ${l.s||'스타일 미선택'}</p></div>`).join(''):'<p class="sub">기록된 코디가 없습니다.</p>'}</div></div>`},
ai(){const r=recommend();return `<h1>AI <b>코디 추천</b></h1><p class="sub">스타일을 선택하면 날씨와 TPO를 반영해 옷장에서 조합합니다.</p>
 <h2>날씨 / 서울</h2><div class="wx"><div class="t">${wx.t}&deg;</div><div><div style="font-weight:600">${wx.rain?'비':'맑음'}</div><div class="sub" style="margin:0">시뮬레이션 값입니다.</div></div>
 <div style="flex:1;min-width:180px"><label style="margin-top:0">기온 ${wx.t}도</label><input type="range" min="-5" max="35" value="${wx.t}" style="padding:0" oninput="wx.t=+this.value;this.previousElementSibling.textContent='기온 '+wx.t+'도'" onchange="rk=0;go('ai')"></div>
 <button class="chip ${wx.rain?'on':''}" onclick="wx.rain=!wx.rain;rk=0;go('ai')">비 예보</button></div>
 <h2>스타일</h2><div class="chips">${STY.map(s=>`<button class="chip ${sel.st==s?'on':''}" onclick="sel.st='${s}';rk=0;go('ai')">${s}</button>`).join('')}</div>
 <h2>TPO</h2><div class="chips"><button class="chip ${!sel.tpo?'on':''}" onclick="sel.tpo=null;rk=0;go('ai')">해당사항 없음</button><button class="chip ${sel.tpo?'on':''}" onclick="tpoPick()">${sel.tpo?'TPO / '+sel.tpo:'TPO 기능 추가'}</button></div>
 <h2>추천 결과</h2>${r?`<div class="out">${[...r.tp,r.b,r.s].filter(Boolean).map(card).join('')}</div><p class="why">${why(r)}</p><div class="row" style="margin-top:22px"><button class="btn p" onclick="wear()">이 코디로 기록</button><button class="btn" onclick="rk++;go('ai')">다시 추천</button></div>`:'<p class="sub">상의와 하의를 먼저 옷장에 추가해 주세요.</p>'}`},
feed(){return `<h1>코디 <b>피드</b></h1><div class="grid l" style="margin-top:28px">${posts.map(post).join('')}</div>`},
wardrobes(){return `<h1>공개 <b>옷장</b></h1><p class="sub">다른 사용자의 옷장에서 어울리는 조합을 제안하거나 교환을 요청할 수 있습니다.</p><div class="grid" style="margin-top:28px">${U.map((u,k)=>ucard(k)).join('')}</div>`},
following(){const f=posts.filter(p=>follow[p.k]);return `<h1><b>팔로잉</b></h1>${f.length?`<div class="grid l" style="margin-top:28px">${f.map(post).join('')}</div>`:'<p class="sub" style="margin-top:14px">팔로우한 사용자가 없습니다. 추천 사용자에서 팔로우해 보세요.</p>'}`},
profile(){return `<div class="u"><div class="av" style="width:64px;height:64px;font-size:22px">현</div><div><h1 style="font-size:24px">이<b>현우</b></h1><p class="sub" style="margin:0">옷 ${items.length}개 / 기록 ${logs.length}회</p></div></div>
 <h2>옷장 공개</h2><div class="chips"><button class="chip ${pub?'on':''}" onclick="pub=!pub;go('profile')">${pub?'공개 중':'비공개'}</button></div><p class="sub" style="margin-top:12px">공개하면 다른 사용자가 내 옷장을 보고 조합을 제안할 수 있습니다.</p>`}};
function post(p){const u=U[p.k],id=p.id;return `<div class="card"><div class="u" style="padding:14px 16px"><div class="av">${u.n[0]}</div><div style="flex:1"><div style="font-weight:600">${u.n}</div><div style="color:var(--tx2);font-size:12px">${u.b}</div></div><button class="chip ${follow[p.k]?'on':''}" onclick="fl(${p.k})">${follow[p.k]?'팔로잉':'팔로우'}</button></div>
 <div class="pair" style="border-radius:0;padding:6px 16px">${p.its.map(i=>`<div class="ph">${ico(i)}</div>`).join('')}</div>
 <div class="cb"><p>${p.t}</p><p class="sub" style="font-size:12px;margin-top:4px">${p.its.map(i=>i.name).join(' / ')}</p><div style="margin-top:8px">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
 <div class="row" style="gap:18px;margin-top:10px"><button class="lk ${like[id+'m']?'on':''}" onclick="lk('${id}')">좋아요 ${like[id]}</button><button class="lk ${save[id]?'on':''}" onclick="sv('${id}')">${save[id]?'저장됨':'저장'}</button><button class="lk" onclick="tw('링크를 복사했습니다')">공유</button></div>
 <div class="cm">${cmts[id].map(c=>`<p><b>${esc(c[0])}</b>${esc(c[1])}</p>`).join('')}<div class="cmi"><input id="c_${id}" placeholder="댓글 작성" onkeydown="if(event.key=='Enter')cm('${id}')"><button class="btn" onclick="cm('${id}')">등록</button></div></div></div></div>`}
function ucard(k){const u=U[k];return `<div class="card"><div class="u" style="padding:16px"><div class="av">${u.n[0]}</div><div style="flex:1"><div style="font-weight:600">${u.n}</div><div style="color:var(--tx2);font-size:12px">${u.b} / 옷 ${u.its.length}개</div></div><button class="chip ${follow[k]?'on':''}" onclick="fl(${k})">${follow[k]?'팔로잉':'팔로우'}</button></div>
 <div class="pair" style="border-radius:0">${u.its.slice(0,3).map(i=>`<div class="ph">${ico(i)}</div>`).join('')}</div><div class="cb"><button class="btn" onclick="open_(${k})">옷장 보기</button></div></div>`}
function open_(k){const u=U[k],tp=u.its.filter(i=>i.type=='top'),bt=u.its.filter(i=>i.type=='bottom');
 modal(`<h3>${u.n}님의 옷장</h3><p class="sub" style="margin:0 0 14px">${u.b}</p><div class="grid" style="grid-template-columns:1fr 1fr;gap:10px">${u.its.map((i,x)=>`<div class="card"><div class="ph">${ico(i)}</div><div class="cb" style="padding:10px 12px"><div class="n" style="font-size:13px">${i.name}</div><div class="row" style="gap:10px"><button class="lk" onclick="trade()">교환 요청</button><button class="lk" onclick="tw('구매 요청을 보냈습니다')">${(15000+x*8000).toLocaleString()}원</button></div></div></div>`).join('')}</div>
 <label>조합 제안</label><div class="two"><select>${tp.map(i=>`<option>${i.name}</option>`).join('')}</select><select>${bt.map(i=>`<option>${i.name}</option>`).join('')}</select></div>
 <div style="margin-top:14px"><button class="btn p" onclick="tw('조합을 제안했습니다');this.closest('.ov').remove()">제안 보내기</button></div>`)}
function trade(){modal(`<h3>교환 요청</h3><p class="sub">교환에 제안할 내 옷을 선택하세요.</p><select style="margin-top:12px">${items.map(i=>`<option>${esc(i.name)}</option>`).join('')}</select><div style="margin-top:16px"><button class="btn p" onclick="tw('교환 요청을 보냈습니다');this.closest('.ov').remove()">요청 보내기</button></div>`)}
function sell(id){const i=byId(id);modal(`<h3>${esc(i.name)}</h3><p class="sub">희망 가격을 입력하면 판매 목록에 등록됩니다. 비워 두면 교환으로 등록됩니다.</p><label>희망 가격(원)</label><input type="number" id="pr" placeholder="예: 25000"><div style="margin-top:18px"><button class="btn p" onclick="listings.push({name:'${esc(i.name)}',price:$('#pr').value});this.closest('.ov').remove();go('closet')">등록</button></div>`)}
function edit(id){const i=byId(id);modal(`<h3>정보 수정</h3><label>이름</label><input id="en" value="${esc(i.name)}"><div class="two"><div><label>핏</label><select id="ef">${['레귤러','오버핏','슬림'].map(f=>`<option ${f==i.fit?'selected':''}>${f}</option>`).join('')}</select></div><div><label>브랜드</label><input id="eb" value="${esc(i.brand)}"></div></div><div style="margin-top:18px"><button class="btn p" onclick="const t=byId(${id});t.name=$('#en').value||t.name;t.fit=$('#ef').value;t.brand=$('#eb').value;edits[${id}]={name:t.name,fit:t.fit,brand:t.brand};this.closest('.ov').remove();go('closet')">저장</button></div>`)}
function tpoPick(){modal(`<h3>TPO 선택</h3><div class="chips" style="margin-top:14px">${TPO.map(t=>`<button class="chip" onclick="sel.tpo='${t}';rk=0;this.closest('.ov').remove();go('ai')">${t}</button>`).join('')}</div>`)}
function fl(k){follow[k]=!follow[k];go(cur)}
function lk(id){like[id+'m']=!like[id+'m'];like[id]+=like[id+'m']?1:-1;go(cur)}
function sv(id){save[id]=!save[id];tw(save[id]?'저장했습니다':'저장을 취소했습니다');go(cur)}
function cm(id){const v=$('#c_'+id).value.trim();if(!v)return;cmts[id].push(['이현우',v]);go(cur)}
function pvw(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{_img=r.result;$('#pv').innerHTML=`<img src="${r.result}" alt="">`};r.readAsDataURL(f)}
function saveItem(){const[t,c]=$('#ct').value.split('|'),st=[...document.querySelectorAll('#sts .on')].map(x=>x.textContent),n=$('#nm').value||'새 옷';
 const it=mk(n,c,t,$('#cl').value,'',$('#sn').value,$('#br').value);it.fit=$('#ft').value;it.date=$('#dt').value;it.st=st.length?st:['캐쥬얼'];if(_img)it.img=_img;_img=null;items.push(it);tw('옷장에 저장했습니다');cf={t:'all',c:''};go('closet')}
function logOutfit(){const ids=['o1','o2','o3','o4'].map(x=>$('#'+x).value).filter(Boolean).map(Number),s=($('#ps .on')||{}).textContent;ids.forEach(i=>pref.it[i]=(pref.it[i]||0)+1);if(s)pref.st[s]=(pref.st[s]||0)+1;
 logs.unshift({ids,s,d:new Date().toLocaleDateString('ko-KR')});tw('코디를 기록했습니다');go('outfit')}
function wear(){const r=recommend(),a=[...r.tp,r.b,r.s].filter(Boolean);a.forEach(i=>pref.it[i.id]=(pref.it[i.id]||0)+1);pref.st[sel.st]=(pref.st[sel.st]||0)+1;logs.unshift({ids:a.map(i=>i.id),s:sel.st,d:new Date().toLocaleDateString('ko-KR')});persist();tw('오늘의 코디로 기록했습니다')}
function go(p){const same=p==cur;cur=p;$('#v').innerHTML=V[p]();if(!same)scrollTo(0,0);persist()}
go('home');
</script></body></html>
